name: Deploy to Pages
on:
  push:
    branches: ["main"]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Find and Build
        run: |
          echo "Listing root:"
          ls -la
          PROJECT_DIR=$(find . -maxdepth 3 -name "package.json" | head -n1 | xargs dirname)
          echo "Found PROJECT_DIR=$PROJECT_DIR"
          cd "$PROJECT_DIR"
          npm install
          npm run build
          cp ./dist/index.html ./dist/404.html
          echo "Build done, dist at $PROJECT_DIR/dist"
          # Copy dist to workspace root for upload
          rm -rf /tmp/dist_upload
          cp -r ./dist /tmp/dist_upload
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '/tmp/dist_upload'
      - id: deployment
        uses: actions/deploy-pages@v4
