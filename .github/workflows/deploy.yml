name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find and Build
        run: |
          echo "Finding package.json..."
          PROJECT_DIR="."
          if [ -f "Legendsnvestors-9bkh56-9bkh56-34623-20261028/package.json" ]; then
            PROJECT_DIR="Legendsnvestors-9bkh56-9bkh56-34623-20261028"
          fi
          if [ -f "Legendsnvestors-9bkh56-9bkh56-34623-20261028/Legendsnvestors-9bkh56-9bkh56-34623-20261028/package.json" ]; then
            PROJECT_DIR="Legendsnvestors-9bkh56-9bkh56-34623-20261028/Legendsnvestors-9bkh56-9bkh56-34623-20261028"
          fi
          echo "Project dir: $PROJECT_DIR"
          cd $PROJECT_DIR
          npm install
          npm run build
          echo "Build done, copying dist..."
          if [ -d "dist" ]; then
            mkdir -p $GITHUB_WORKSPACE/dist_final
            cp -r dist/* $GITHUB_WORKSPACE/dist_final/
          fi
          cd $GITHUB_WORKSPACE
          if [ ! -d "dist" ] && [ -d "dist_final" ]; then
            mv dist_final dist
          fi
          ls -la dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
